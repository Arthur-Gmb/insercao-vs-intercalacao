name: testes

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar os testes
        run: python testes.py

      - name: Refazer CSV e gráficos do zero
        run: python medir.py

      - name: Conferir arquivos gerados
        shell: bash
        run: |
          for f in dados.csv virada.csv figuras/tempos-claro.png figuras/comparacoes-claro.png figuras/virada-claro.png; do
            test -s "$f" || { echo "faltou $f"; exit 1; }
          done
          echo "Tudo gerado ✔"
